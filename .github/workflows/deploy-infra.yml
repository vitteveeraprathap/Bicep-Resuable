name: Deploy Azure Infrastructure

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Select environment"
        required: true
        default: "dev"
        type: choice
        options:
          - dev
          - qa
          - prod

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Validate Bicep templates
        run: |
          az bicep build --file infra/rg.bicep
          az bicep build --file infra/str.bicep

      - name: Deploy Resource Group
        run: |
          az deployment sub create \
            --location southeastasia \
            --template-file infra/rg.bicep \
            --parameters @"infra/rg-${{ github.event.inputs.environment }}.parameters.json"

      - name: Deploy Storage Account
        run: |
          RG_NAME=$(jq -r '.parameters.rgName.value' infra/rg-${{ github.event.inputs.environment }}.parameters.json)
          az deployment group create \
            --resource-group $RG_NAME \
            --template-file infra/str.bicep \
            --parameters @"infra/str-${{ github.event.inputs.environment }}.parameters.json"
