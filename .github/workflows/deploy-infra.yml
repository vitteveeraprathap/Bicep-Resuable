name: Deploy Azure Infra

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Select environment (dev, qa, prod)"
        required: true
        default: "dev"
        type: choice
        options:
          - dev
          - qa
          - prod

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Setup Bicep
        run: |
          az bicep install
          az bicep upgrade

      # 👇 Bicep lint check
      - name: Lint Bicep Files
        run: |
          echo "Running Bicep linting..."
          az bicep build --file infra/main.bicep --no-restore
          az bicep lint --file infra/main.bicep

      # 👇 New: Validate storage account name pattern
      - name: Validate Storage Account Name Pattern
        run: |
          echo "Checking storage account name pattern..."
          STORAGE_NAME=$(jq -r '.parameters.storageAccountName.value' infra/parameters.${{ github.event.inputs.environment }}.json)
          if [[ ! "$STORAGE_NAME" =~ ^[a-z0-9]{3,24}$ ]]; then
            echo "❌ Invalid storage account name: $STORAGE_NAME"
            echo "   It must match the pattern: ^[a-z0-9]{3,24}$"
            exit 1
          fi
          echo "✅ Storage account name is valid: $STORAGE_NAME"

      # 👇 Template validation
      - name: Validate Template
        run: |
          az deployment group validate \
            --resource-group sandbox1 \
            --template-file infra/main.bicep \
            --parameters @infra/parameters.${{ github.event.inputs.environment }}.json

      - name: Deploy Template
        run: |
          az deployment group create \
            --name "deploy-${{ github.event.inputs.environment }}-${{ github.run_id }}" \
            --resource-group sandbox1 \
            --template-file infra/main.bicep \
            --parameters @infra/parameters.${{ github.event.inputs.environment }}.json

      - name: Show Outputs
        run: |
          az deployment group show \
            --resource-group sandbox1 \
            --name "deploy-${{ github.event.inputs.environment }}-${{ github.run_id }}" \
            --query properties.outputs
