name: Deploy Azure Infrastructure

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Select environment"
        required: true
        default: "dev"
        type: choice
        options:
          - dev
          - qa
          - prod

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Set environment variables
        run: |
          echo "PARAM_FILE=infra/parameters.${{ github.event.inputs.environment }}.json" >> $GITHUB_ENV
          echo "RESOURCE_GROUP=${{ secrets.AZURE_RG }}" >> $GITHUB_ENV

      - name: Validate Bicep file
        run: |
          az bicep build --file infra/**.bicep

      - name: Deploy RG 
        run: |
          az deployment sub create \
            --location westus2 \
            --template-file infra/rg.bicep
            --parameters @"$PARAM_FILE"

      - name: Deploy Bicep to Azure
        run: |
          az deployment group create \
            --resource-group $RESOURCE_GROUP \
            --template-file infra/str.bicep \
            --parameters @"$PARAM_FILE"
      
