name: rg-deploy-and-call-str

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Select environment"
        required: true
        default: "dev"
        type: choice
        options: [dev, uat, prod]

jobs:
  create-rg:
    runs-on: ubuntu-latest
    outputs:
      rg_name: ${{ steps.set-rg.outputs.rg_name }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Validate rg.bicep
        run: az bicep build --file infra/rg.bicep

      - name: Deploy subscription (create Resource Group)
        id: deploy
        run: |
          az deployment sub create \
            --name infra-rg-${{ github.event.inputs.environment }} \
            --location southeastasia \
            --template-file infra/rg.bicep \
            --parameters @"infra/rg-${{ github.event.inputs.environment }}.parameters.json"

      - name: Read created Resource Group name from deployment outputs
        id: set-rg
        run: |
          # Adjust the query if your rg.bicep returns a different output name.
          RG_NAME=$(az deployment sub show \
            --name infra-rg-${{ github.event.inputs.environment }} \
            --query "properties.outputs.resourceGroupName.value" -o tsv || true)

          # Fallback: if your RG name is deterministic (eg rg-${env}), use that
          if [ -z "$RG_NAME" ]; then
            RG_NAME="rg-${{ github.event.inputs.environment }}"
          fi

          echo "Resource group: $RG_NAME"
          echo "rg_name=$RG_NAME" >> $GITHUB_OUTPUT

  call-str:
    needs: create-rg
    # Call the reusable workflow in the same repository
    uses: ./.github/workflows/str.yml
    with:
      environment: ${{ github.event.inputs.environment }}
      resource_group: ${{ needs.create-rg.outputs.rg_name }}
    secrets:
      # pass the Azure credentials secret to the reusable workflow
      AZURE_CREDENTIALS: ${{ secrets.AZURE_CREDENTIALS }}
