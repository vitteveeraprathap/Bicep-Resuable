name: str-reusable

on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
      resource_group:
        required: true
        type: string

jobs:
  deploy-str:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to Azure
        uses: azure/login@v2
        # The caller should pass this secret (see rg.yml below)
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Validate str.bicep
        run: az bicep build --file infra/str.bicep

      - name: Deploy 'str' into resource group
        run: |
          az deployment group create \
            --resource-group "${{ inputs.resource_group }}" \
            --template-file infra/str.bicep \
            --parameters @"infra/str-${{ inputs.environment }}.parameters.json"
