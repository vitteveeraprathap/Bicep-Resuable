name: Validate PR source to master

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
    branches:
      - master

jobs:
  validate-source:
    runs-on: ubuntu-latest
    steps:
      - name: Validate allowed source branches
        run: |
          HEAD="${{ github.head_ref }}"
          echo "Source branch: $HEAD"

          # Only allow merges from develop, release/*, or hotfix/*
          if [[ "$HEAD" =~ ^develop$ || "$HEAD" =~ ^release\/.+$ || "$HEAD" =~ ^hotfix\/.+$ ]]; then
            echo "✅ Allowed source branch: $HEAD"
          else
            echo "::error ::❌ Invalid source branch. Only 'develop', 'release/*', or 'hotfix/*' branches can merge into master."
            exit 1
          fi
