name: Validate Commit Message (JIRA ID check)

on:
  push:
    # run on feature branches immediately (change pattern fot testing)
    branches:
      - 'feature/se-*'
  pull_request:
    branches:
      - develop
      - master
    types: [opened, synchronize, reopened, ready_for_review]

jobs:
  validate-commits:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code (full history)
        uses: actions/checkout@v4
        with:
          # Important: fetch full history so git log works reliably
          fetch-depth: 0
          # fetch all tags and refs
          fetch-tags: true

      - name: Debug info (helpful for troubleshooting)
        run: |
          echo "GITHUB_EVENT_NAME=${{ github.event_name }}"
          echo "GITHUB_REF=${GITHUB_REF}"
          echo "github.head_ref='${{ github.head_ref }}'"
          echo "github.base_ref='${{ github.base_ref }}'"
          echo "GITHUB_ACTOR=${GITHUB_ACTOR}"
          echo "------"

      - name: Determine branch name correctly
        id: branch
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BRANCH="${{ github.head_ref }}"
          else
            # For push events, GITHUB_REF is refs/heads/<branch>
            BRANCH="${GITHUB_REF#refs/heads/}"
          fi
          echo "branch=${BRANCH}" >> "$GITHUB_OUTPUT"
          echo "Detected branch: ${BRANCH}"
      - name: Validate commit messages contain JIRA ID
        run: |
          BRANCH="${{ steps.branch.outputs.branch }}"
          echo "Branch = $BRANCH"

          # Extract JIRA ID pattern from the branch name
          if [[ "$BRANCH" =~ (feature/se-[0-9]+) ]]; then
            JIRA_ID="${BASH_REMATCH[1]}"
            echo "Expected JIRA ID: $JIRA_ID"
          else
            echo "::error::❌ Branch name does not match expected pattern 'feature/se-####': $BRANCH"
            exit 1
          fi

          # Compute commit range:
          # - For PRs use origin/<base>..HEAD
          # - For pushes use the commit range available in the push event if provided,
          #   otherwise fall back to last 50 commits.
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.base_ref }}"
            echo "PR base branch: $BASE"
            git fetch origin "$BASE":"refs/remotes/origin/$BASE" || true
            RANGE="origin/${BASE}..HEAD"
          else
            # For push events GitHub provides GITHUB_SHA and before commit as context is not always provided, so just check recent commits
            RANGE="HEAD~50..HEAD"
          fi

          echo "Using commit range: $RANGE"
          COMMITS=$(git log --pretty=format:"%s" "$RANGE" || git log -n 50 --pretty=format:"%s")
          echo "---- Commit Messages ----"
          echo "$COMMITS"
          echo "--------------------------"

          INVALID=false
          while IFS= read -r msg; do
            # skip empty lines
            if [[ -z "${msg// /}" ]]; then
              continue
            fi
            if [[ "$msg" != *"$JIRA_ID"* ]]; then
              echo "::error::❌ Commit message missing required JIRA ID '$JIRA_ID': $msg"
              INVALID=true
            fi
          done <<< "$COMMITS"

          if [ "$INVALID" = true ]; then
            echo "❌ One or more commits missing required JIRA ID ($JIRA_ID)."
            exit 1
          fi

          echo "✅ All scanned commit messages include required JIRA ID: $JIRA_ID"
