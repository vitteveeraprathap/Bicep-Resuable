name: Validate Commit Message (JIRA ID check)

on:
  pull_request:
    branches:
      - develop
      - master
    types: [opened, synchronize, reopened, ready_for_review]

jobs:
  validate-commits:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate commit messages contain JIRA ID
        run: |
          echo "🔍 Validating commit messages..."

          # Get the PR source branch name (e.g., feature/se-9999)
          BRANCH="${{ github.head_ref }}"
          echo "Current branch: $BRANCH"

          # Extract the JIRA ID pattern from the branch name
          if [[ "$BRANCH" =~ (feature/se-[0-9]+) ]]; then
            JIRA_ID="${BASH_REMATCH[1]}"
            echo "Expected JIRA ID in commit messages: $JIRA_ID"
          else
            echo "::error::❌ Branch name does not match expected JIRA pattern (feature/se-####)."
            echo "Example: feature/se-4650"
            exit 1
          fi

          # Fetch all commit messages between base and head of the PR
          COMMITS=$(git log origin/${{ github.base_ref }}..HEAD --pretty=format:"%s")
          echo "---- Commit Messages ----"
          echo "$COMMITS"
          echo "--------------------------"

          INVALID=false
          while IFS= read -r msg; do
            if [[ "$msg" != *"$JIRA_ID"* ]]; then
              echo "::error::❌ Commit message missing required JIRA ID '$JIRA_ID': $msg"
              INVALID=true
            fi
          done <<< "$COMMITS"

          if [ "$INVALID" = true ]; then
            echo "❌ One or more commits missing required JIRA ID ($JIRA_ID)."
            exit 1
          fi

          echo "✅ All commits include the required JIRA ID: $JIRA_ID"
