name: Validate Commit Message (JIRA ID check)

on:
  push:
    branches:
      - 'feature/se-*'
  pull_request:
    branches:
      - develop
      - master
    types: [opened, synchronize, reopened, ready_for_review]

jobs:
  validate-commits:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Debug info
        run: |
          echo "EVENT_NAME=${{ github.event_name }}"
          echo "GITHUB_REF=${GITHUB_REF}"
          echo "GITHUB_SHA=${GITHUB_SHA}"
          echo "GITHUB_EVENT_PATH=${GITHUB_EVENT_PATH}"
          echo "github.head_ref='${{ github.head_ref }}'"
          echo "github.base_ref='${{ github.base_ref }}'"
          echo "GITHUB_ACTOR=${GITHUB_ACTOR}"
          echo "------"

      - name: Determine branch name
        id: branch
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BRANCH="${{ github.head_ref }}"
          else
            BRANCH="${GITHUB_REF#refs/heads/}"
          fi
          echo "branch=${BRANCH}" >>"$GITHUB_OUTPUT"
          echo "Detected branch: ${BRANCH}"

      - name: Validate commit messages contain JIRA ID (case-insensitive)
        run: |
          set -euo pipefail
          BRANCH="${{ steps.branch.outputs.branch }}"
          echo "Branch = $BRANCH"

          # Normalize to lowercase for matching
          BRANCH_LC="$(echo "$BRANCH" | tr '[:upper:]' '[:lower:]')"

          # Extract JIRA ID (feature/se-1234) from branch (case-insensitive)
          if [[ "$BRANCH_LC" =~ (feature/se-[0-9]+) ]]; then
            JIRA_ID="${BASH_REMATCH[1]}"
            echo "Expected JIRA ID (lowercased): $JIRA_ID"
          else
            echo "::error::❌ Branch name does not match expected pattern 'feature/se-####': $BRANCH"
            exit 1
          fi

          # Determine commit range precisely
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.base_ref }}"
            echo "PR base branch: $BASE"
            git fetch origin "$BASE":"refs/remotes/origin/$BASE" || true
            RANGE="origin/${BASE}..HEAD"
          else
            # For push events use the exact pushed range if available
            BEFORE="${{ github.event.before }}"
            AFTER="${{ github.sha }}"
            echo "push before: $BEFORE"
            echo "push after: $AFTER"
            # GitHub uses all zero before for first push/branch creation
            if [ -n "$BEFORE" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ]; then
              RANGE="${BEFORE}..${AFTER}"
            else
              # fallback: check last 50 commits
              RANGE="HEAD~50..HEAD"
            fi
          fi

          echo "Using commit range: $RANGE"
          # Try to get commit subjects; if range fails, fallback to last 50 commits
          COMMITS=$(git log --pretty=format:"%s" "$RANGE" 2>/dev/null || git log -n 50 --pretty=format:"%s")
          echo "---- Commit Messages ----"
          echo "$COMMITS"
          echo "--------------------------"

          INVALID=false
          # Compare in lowercase to make matching case-insensitive
          while IFS= read -r msg; do
            # skip empty lines
            if [[ -z "${msg// /}" ]]; then
              continue
            fi
            msg_lc="$(echo "$msg" | tr '[:upper:]' '[:lower:]')"
            if [[ "$msg_lc" != *"${JIRA_ID}"* ]]; then
              echo "::error::❌ Commit message missing required JIRA ID '$JIRA_ID': $msg"
              INVALID=true
            fi
          done <<< "$COMMITS"

          if [ "$INVALID" = true ]; then
            echo "❌ One or more commits missing required JIRA ID ($JIRA_ID)."
            exit 1
          fi

          echo "✅ All scanned commit messages include required JIRA ID: $JIRA_ID"
